# Custom ModSecurity rules: DVWA SQLi & XSS hardening
# Bincom Training: Assignment 3
# These supplement (not replace) the OWASP CRS base rules.

# SecRuleEngine On

# --- Custom SQL Injection rules ---
# Block ORDER BY based column enumeration probing (used in our Phase 1 attack)
SecRule ARGS "@rx (?i:order\s+by\s+\d+)" \
    "id:1001,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'Custom Rule: SQLi ORDER BY column enumeration attempt',\
    logdata:'Matched Data: %{MATCHED_VAR} found in %{MATCHED_VAR_NAME}',\
    severity:'CRITICAL',\
    tag:'attack-sqli',\
    tag:'custom-rule'"

# Block UNION SELECT based extraction (used in our Phase 1 attack)
SecRule ARGS "@rx (?i:union\s+select)" \
    "id:1002,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'Custom Rule: SQLi UNION SELECT extraction attempt',\
    logdata:'Matched Data: %{MATCHED_VAR} found in %{MATCHED_VAR_NAME}',\
    severity:'CRITICAL',\
    tag:'attack-sqli',\
    tag:'custom-rule'"

# Block classic tautology-based auth/filter bypass (e.g. ' OR '1'='1)
SecRule ARGS "@rx (?i:'\s*or\s*'?\d*'?\s*=\s*'?\d*)" \
    "id:1003,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'Custom Rule: SQLi tautology (OR 1=1 style) bypass attempt',\
    logdata:'Matched Data: %{MATCHED_VAR} found in %{MATCHED_VAR_NAME}',\
    severity:'CRITICAL',\
    tag:'attack-sqli',\
    tag:'custom-rule'"

# --- Custom XSS rules ---
# Block <script> tag injection (used in our Phase 1 reflected & stored XSS)
SecRule ARGS "@rx (?i:<script[^>]*>)" \
    "id:1101,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'Custom Rule: XSS <script> tag injection attempt',\
    logdata:'Matched Data: %{MATCHED_VAR} found in %{MATCHED_VAR_NAME}',\
    severity:'CRITICAL',\
    tag:'attack-xss',\
    tag:'custom-rule'"

# Block inline event-handler based XSS (onerror=, onload=, etc.)
SecRule ARGS "@rx (?i:on\w+\s*=)" \
    "id:1102,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'Custom Rule: XSS inline event handler injection attempt',\
    logdata:'Matched Data: %{MATCHED_VAR} found in %{MATCHED_VAR_NAME}',\
    severity:'CRITICAL',\
    tag:'attack-xss',\
    tag:'custom-rule'"

# Block javascript: URI scheme based XSS
SecRule ARGS "@rx (?i:javascript\s*:)" \
    "id:1103,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'Custom Rule: XSS javascript: URI scheme attempt',\
    logdata:'Matched Data: %{MATCHED_VAR} found in %{MATCHED_VAR_NAME}',\
    severity:'CRITICAL',\
    tag:'attack-xss',\
    tag:'custom-rule'"
